name: Deploy

# Manual trigger: deploying is intentional, not on every commit. Requires the
# repo variable AWS_DEPLOY_ROLE_ARN and the one-time bootstrap (see infra/README).
on:
  workflow_dispatch:

permissions:
  id-token: write # for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT: credit-risk-scoring

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Resolve account id
        id: aws
        run: echo "account=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init (remote state)
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${PROJECT}-tfstate-${{ steps.aws.outputs.account }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${PROJECT}-tflock"

      - name: Create ECR repository
        run: terraform -chdir=infra apply -auto-approve -target=aws_ecr_repository.this

      - name: Build and push image
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:latest" -f serving/Dockerfile .
          docker push "$REPO:latest"

      - name: Terraform apply (Lambda + API Gateway)
        run: terraform -chdir=infra apply -auto-approve

      - name: Show endpoint
        run: terraform -chdir=infra output -raw predict_url
