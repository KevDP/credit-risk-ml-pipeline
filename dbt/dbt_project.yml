name: credit_risk
version: "0.1.0"
config-version: 2

profile: credit_risk

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Raw Lending Club file, relative to this directory. dbt is always invoked
  # from the dbt/ folder (see the Makefile), so relative paths stay stable.
  raw_accepted_file: "../data/accepted_2007_to_2018Q4.csv.gz"

models:
  credit_risk:
    staging:
      # Materialized rather than a view: a view would re-decompress the 392 MB
      # source file on every downstream query and every test.
      +materialized: table
    marts:
      +materialized: table

seeds:
  credit_risk:
    +quote_columns: false
    application_time_allowlist:
      +column_types:
        column_name: varchar
        role: varchar
    loan_status_labels:
      +column_types:
        loan_status: varchar
        label: integer
