# Committed on purpose: the warehouse is a local DuckDB file, so there are no
# credentials here. dbt is invoked with --profiles-dir . from the dbt/ folder.
credit_risk:
  target: local
  outputs:
    local:
      type: duckdb
      # Lives under data/, which is already gitignored in full.
      path: "../data/warehouse.duckdb"
      threads: 4
    # Used by the fixture build (CI, and locally without clobbering the real
    # warehouse). Same models and same contracts, different source and file.
    ci:
      type: duckdb
      path: "../data/warehouse_ci.duckdb"
      threads: 4
