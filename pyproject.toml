[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-ml-pipeline"
version = "0.1.0"
description = "End-to-end, scale-to-zero credit default risk pipeline (Lending Club)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Delgado" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "shap>=0.45",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "seaborn>=0.13",
    "optuna>=3.6",
]
serving = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "mangum>=0.17",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Exploratory notebooks are not linted (avoids churn with their saved outputs).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is left to the formatter/editor, not enforced as a lint error.
ignore = ["E501"]
